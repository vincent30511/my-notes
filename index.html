<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>CloudNotes Pro - 雲端筆記工作區</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            notion: {
              gray: '#f7f6f3',
              dark: '#191919',
              darker: '#121212',
              card: '#202020',
              border: '#e9e9e7',
              borderDark: '#2f2f2f',
              accent: '#2383e2'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Helvetica', '"Apple Color Emoji"', 'Arial', 'sans-serif', '"Segoe UI Emoji"', '"Segoe UI Symbol"']
          }
        }
      }
    }
  </script>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Marked for Markdown parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- DOMPurify for security -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white text-gray-800 dark:bg-notion-dark dark:text-gray-100 flex flex-col h-screen overflow-hidden font-sans select-none md:select-auto">

  <!-- 隱藏的檔案上傳輸入項 (支援照片、圖片、影片多選) -->
  <input type="file" id="media-upload-input" accept="image/*,video/*" multiple class="hidden">

  <!-- 手機側邊欄遮罩 -->
  <div id="sidebar-backdrop" class="fixed inset-0 bg-black/50 z-30 hidden md:hidden backdrop-blur-xs transition-opacity"></div>

  <!-- 頂部導覽列 -->
  <header class="h-12 border-b border-gray-200 dark:border-notion-borderDark bg-white dark:bg-notion-dark flex items-center justify-between px-3 z-20 shrink-0">
    <div class="flex items-center space-x-2 truncate">
      <!-- 手機/電腦 側邊欄切換 -->
      <button id="toggle-sidebar-btn" class="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300" title="開啟筆記選單">
        <i data-lucide="menu" class="w-5 h-5"></i>
      </button>
      
      <!-- 麵包屑導航 -->
      <div class="flex items-center text-xs text-gray-500 dark:text-gray-400 space-x-1.5 truncate">
        <span class="flex items-center gap-1 font-medium text-gray-700 dark:text-gray-300 shrink-0">
          <span id="header-folder-name">DriveNotes</span>
        </span>
        <span>/</span>
        <span id="header-note-title" class="truncate max-w-[110px] sm:max-w-xs text-gray-900 dark:text-white font-medium">未命名筆記</span>
      </div>

      <!-- 同步狀態指示燈 -->
      <div id="sync-status" class="ml-1 flex items-center gap-1 text-[11px] px-2 py-0.5 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-500 shrink-0">
        <span id="sync-indicator" class="w-1.5 h-1.5 rounded-full bg-gray-400"></span>
        <span id="sync-text" class="hidden sm:inline">未連線</span>
      </div>
    </div>

    <!-- 右側工具按鈕 -->
    <div class="flex items-center space-x-1 shrink-0">
      
      <!-- 📷 插入圖片/影片 按鈕 -->
      <button id="insert-media-btn" class="p-1.5 rounded-md hover:bg-blue-50 dark:hover:bg-gray-800 text-blue-600 dark:text-blue-400 flex items-center gap-1 text-xs font-medium" title="上傳照片、圖片或影片">
        <i data-lucide="image-plus" class="w-4 h-4"></i>
        <span class="hidden sm:inline">圖影</span>
      </button>

      <!-- 手機專屬：編輯/預覽 快速切換鈕 -->
      <button id="mobile-toggle-view-btn" class="md:hidden p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-600 dark:text-gray-300" title="切換編輯/預覽">
        <i data-lucide="eye" class="w-4 h-4" id="mobile-view-icon"></i>
      </button>

      <!-- 電腦專用：檢視模式切換 (雙欄/編輯/預覽) -->
      <div class="hidden md:flex bg-gray-100 dark:bg-gray-800 p-0.5 rounded-md text-xs mr-1">
        <button id="view-split-btn" class="px-2 py-0.5 rounded font-medium text-gray-600 dark:text-gray-300 hover:text-gray-900" title="雙欄對照">雙欄</button>
        <button id="view-edit-btn" class="px-2 py-0.5 rounded font-medium text-gray-600 dark:text-gray-300 hover:text-gray-900" title="純編輯">編輯</button>
        <button id="view-preview-btn" class="px-2 py-0.5 rounded font-medium text-gray-600 dark:text-gray-300 hover:text-gray-900" title="純預覽">預覽</button>
      </div>

      <!-- 匯出選單 -->
      <div class="relative">
        <button id="export-dropdown-btn" class="p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500" title="匯出筆記">
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
        <div id="export-menu" class="absolute right-0 mt-1 w-44 bg-white dark:bg-notion-card rounded-lg shadow-xl border border-gray-200 dark:border-notion-borderDark py-1 hidden z-50 text-xs">
          <button id="export-md-btn" class="w-full text-left px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2">
            <i data-lucide="file-text" class="w-3.5 h-3.5"></i> 匯出 Markdown (.md)
          </button>
          <button id="export-html-btn" class="w-full text-left px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2">
            <i data-lucide="code" class="w-3.5 h-3.5"></i> 匯出 HTML 網頁
          </button>
          <button id="export-pdf-btn" class="w-full text-left px-3 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 flex items-center gap-2">
            <i data-lucide="printer" class="w-3.5 h-3.5"></i> 列印 / 另存為 PDF
          </button>
        </div>
      </div>

      <!-- 大綱目錄切換按鈕 (大螢幕) -->
      <button id="toggle-outline-btn" class="hidden lg:block p-1.5 rounded-md hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500" title="大綱目錄 (TOC)">
        <i data-lucide="list" class="w-4 h-4"></i>
      </button>

      <!-- 明暗主題切換 -->
      <button id="theme-toggle-btn" class="p-1.5 rounded-md text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800" title="切換主題">
        <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        <i data-lucide="moon" class="w-4 h-4 block dark:hidden"></i>
      </button>

      <!-- 設定 -->
      <button id="settings-btn" class="p-1.5 rounded-md text-gray-500 hover:bg-gray-100 dark:hover:bg-gray-800" title="設定 Google API">
        <i data-lucide="settings" class="w-4 h-4"></i>
      </button>

      <!-- 登入 / 使用者資訊 -->
      <div id="auth-container" class="ml-1">
        <button id="login-btn" class="inline-flex items-center space-x-1 px-2.5 py-1 rounded-md bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium transition shadow-sm">
          <i data-lucide="log-in" class="w-3.5 h-3.5"></i>
          <span>登入</span>
        </button>
        <div id="user-profile" class="hidden items-center space-x-1.5">
          <img id="user-avatar" class="w-6 h-6 rounded-full border border-gray-200 dark:border-gray-700" alt="Avatar">
          <button id="logout-btn" class="p-1 rounded-md text-gray-400 hover:text-red-500" title="登出">
            <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- 主工作區 -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- 側邊欄（手機抽屜式 / 電腦固定式） -->
    <aside id="sidebar" class="w-72 md:w-64 border-r border-gray-200 dark:border-notion-borderDark bg-notion-gray dark:bg-notion-card flex flex-col transition-all duration-200 z-40 fixed md:static inset-y-0 left-0 -translate-x-full md:translate-x-0 shadow-2xl md:shadow-none shrink-0 h-full">
      
      <!-- 側欄頂部 -->
      <div class="p-3 border-b border-gray-200/60 dark:border-notion-borderDark flex items-center justify-between">
        <div class="flex items-center space-x-2">
          <div class="w-6 h-6 rounded bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white text-xs font-bold shadow-sm">
            N
          </div>
          <span class="text-sm font-semibold tracking-tight text-gray-800 dark:text-gray-100">個人知識庫</span>
        </div>
        <div class="flex items-center space-x-1">
          <button id="new-note-btn" class="p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500" title="新增筆記">
            <i data-lucide="plus" class="w-4 h-4"></i>
          </button>
          <button id="close-sidebar-mobile-btn" class="md:hidden p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-500" title="關閉選單">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
      </div>

      <!-- 搜尋列 -->
      <div class="px-3 pt-2">
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-gray-400"></i>
          <input type="text" id="search-input" placeholder="搜尋筆記與標籤..." class="w-full pl-8 pr-2.5 py-1.5 text-xs bg-white dark:bg-notion-dark border border-gray-200 dark:border-notion-borderDark rounded-md focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>
      </div>

      <!-- 分類與篩選器 Tabs -->
      <div class="px-3 pt-2">
        <div class="flex items-center gap-1 text-[11px] text-gray-500 border-b border-gray-200 dark:border-notion-borderDark pb-1.5 overflow-x-auto">
          <button id="filter-all-btn" class="px-2 py-0.5 rounded font-medium bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-white shrink-0">全部</button>
          <button id="filter-pinned-btn" class="px-2 py-0.5 rounded font-medium hover:bg-gray-200 dark:hover:bg-gray-700 shrink-0">📌 置頂</button>
          <button id="filter-doing-btn" class="px-2 py-0.5 rounded font-medium hover:bg-gray-200 dark:hover:bg-gray-700 shrink-0">🚀 進行中</button>
        </div>
      </div>

      <!-- 檢視模式選擇（清單 vs 卡片看板） -->
      <div class="px-3 pt-2 flex items-center justify-between text-xs text-gray-400">
        <span class="text-[11px] uppercase tracking-wider font-semibold">筆記列表</span>
        <div class="flex items-center space-x-1">
          <button id="layout-list-btn" class="p-1 rounded text-blue-600 dark:text-blue-400 hover:bg-gray-200 dark:hover:bg-gray-700" title="清單檢視">
            <i data-lucide="list" class="w-3.5 h-3.5"></i>
          </button>
          <button id="layout-grid-btn" class="p-1 rounded text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-700" title="畫廊卡片檢視">
            <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- 筆記列表容器 -->
      <div id="notes-list" class="flex-1 overflow-y-auto p-2 space-y-1">
        <div id="notes-loading" class="text-center py-10 text-gray-400 text-xs">
          請先點擊右上角「登入」以同步 Google Drive 筆記
        </div>
      </div>

      <!-- 側邊欄底部資訊 -->
      <div class="p-2.5 border-t border-gray-200 dark:border-notion-borderDark text-[11px] text-gray-400 flex items-center justify-between">
        <span class="flex items-center gap-1.5 truncate">
          <i data-lucide="cloud" class="w-3 h-3 text-blue-500"></i>
          <span id="sidebar-folder-label">DriveNotes</span>
        </span>
        <button id="refresh-btn" class="p-1 rounded hover:bg-gray-200 dark:hover:bg-gray-700 hover:text-gray-600" title="重新整理">
          <i data-lucide="rotate-cw" class="w-3 h-3"></i>
        </button>
      </div>
    </aside>

    <!-- 主編輯與預覽區域 -->
    <main class="flex-1 flex flex-col bg-white dark:bg-notion-dark overflow-hidden relative">
      
      <!-- 上傳進度提示條 -->
      <div id="upload-progress-bar" class="h-1 bg-blue-500 w-0 transition-all duration-300 hidden"></div>

      <!-- Notion 頁首屬性欄 (Page Header & Properties) -->
      <div id="page-header" class="px-4 sm:px-8 pt-4 pb-3 border-b border-gray-100 dark:border-notion-borderDark shrink-0 bg-white dark:bg-notion-dark">
        <!-- 頁面圖示 (Emoji) 與 標題 -->
        <div class="flex items-start space-x-2 sm:space-x-3 mb-2">
          <!-- 點選切換 Emoji -->
          <div class="relative shrink-0">
            <button id="note-emoji-btn" class="text-2xl sm:text-3xl hover:bg-gray-100 dark:hover:bg-gray-800 p-1 rounded-lg transition" title="更換圖示">📝</button>
            <div id="emoji-picker" class="absolute left-0 top-11 bg-white dark:bg-notion-card border border-gray-200 dark:border-notion-borderDark rounded-xl shadow-2xl p-2 hidden z-50 grid grid-cols-6 gap-1 w-60">
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">📝</button>
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">💡</button>
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">🚀</button>
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">📚</button>
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">🎯</button>
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">📷</button>
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">💻</button>
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">📊</button>
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">☕</button>
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">🎨</button>
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">🌟</button>
              <button class="emoji-opt p-1.5 text-xl hover:bg-gray-100 dark:hover:bg-gray-800 rounded">📦</button>
            </div>
          </div>

          <!-- 主標題 -->
          <div class="flex-1 min-w-0">
            <input type="text" id="note-title" placeholder="無標題筆記" class="w-full text-xl sm:text-2xl font-bold bg-transparent border-none focus:outline-none text-gray-900 dark:text-gray-100 placeholder-gray-300 dark:placeholder-gray-600 truncate">
          </div>

          <!-- 置頂按鈕 & 刪除按鈕 -->
          <div class="flex items-center space-x-1 shrink-0">
            <button id="note-pin-btn" class="p-1.5 rounded-md text-gray-400 hover:text-amber-500 hover:bg-gray-100 dark:hover:bg-gray-800" title="置頂此筆記">
              <i data-lucide="pin" class="w-4 h-4"></i>
            </button>
            <button id="delete-note-btn" class="p-1.5 rounded-md text-gray-400 hover:text-red-500 hover:bg-red-50 dark:hover:bg-gray-800" title="刪除筆記">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <!-- 屬性面板 (狀態、標籤) -->
        <div class="flex flex-wrap items-center gap-2 text-xs text-gray-600 dark:text-gray-300">
          <div class="flex items-center space-x-1.5">
            <span class="text-gray-400">狀態:</span>
            <select id="note-status-select" class="px-2 py-0.5 rounded bg-gray-100 dark:bg-gray-800 border-none font-medium focus:ring-1 focus:ring-blue-500 text-xs">
              <option value="💡 構思中">💡 構思中</option>
              <option value="🚀 進行中">🚀 進行中</option>
              <option value="✅ 已完成">✅ 已完成</option>
              <option value="📦 封存">📦 封存</option>
            </select>
          </div>

          <div class="flex items-center space-x-1.5 flex-1 min-w-[150px]">
            <span class="text-gray-400">標籤:</span>
            <input type="text" id="note-tags-input" placeholder="例如: 工作, 會議" class="flex-1 px-2 py-0.5 rounded bg-gray-100 dark:bg-gray-800 border-none focus:ring-1 focus:ring-blue-500 text-xs text-gray-800 dark:text-gray-200">
          </div>
        </div>
      </div>

      <!-- 編輯區與預覽區容器 -->
      <div id="content-container" class="flex-1 flex overflow-hidden relative">
        
        <!-- Markdown 原始碼編輯區 -->
        <div id="editor-wrapper" class="flex-1 h-full overflow-hidden border-r border-gray-100 dark:border-notion-borderDark relative flex flex-col">
          <textarea id="markdown-input" class="w-full flex-1 p-4 sm:p-6 resize-none bg-white dark:bg-notion-dark text-gray-800 dark:text-gray-200 font-mono text-sm leading-relaxed focus:outline-none" placeholder="輸入內容... 支援直接貼上圖片，或按上方「圖影」上傳照片與影片！"></textarea>

          <!-- 浮動 Slash 指令選單 (Notion / Command Menu) -->
          <div id="slash-menu" class="absolute hidden bg-white dark:bg-notion-card border border-gray-200 dark:border-notion-borderDark rounded-lg shadow-2xl w-60 p-1 z-50 text-xs">
            <div class="px-2 py-1 text-[10px] font-semibold text-gray-400 uppercase tracking-wider">常用積木</div>
            <button data-slash="media" class="w-full text-left px-2.5 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded flex items-center gap-2 text-blue-600 dark:text-blue-400 font-medium">
              <i data-lucide="image" class="w-3.5 h-3.5"></i> 上傳圖片 / 影片
            </button>
            <button data-slash="h1" class="w-full text-left px-2.5 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded flex items-center gap-2">
              <span class="font-bold text-gray-500">H1</span> 大標題 1
            </button>
            <button data-slash="h2" class="w-full text-left px-2.5 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded flex items-center gap-2">
              <span class="font-semibold text-gray-500">H2</span> 中標題 2
            </button>
            <button data-slash="h3" class="w-full text-left px-2.5 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded flex items-center gap-2">
              <span class="font-medium text-gray-500">H3</span> 小標題 3
            </button>
            <button data-slash="todo" class="w-full text-left px-2.5 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded flex items-center gap-2">
              <i data-lucide="check-square" class="w-3.5 h-3.5 text-blue-500"></i> 待辦清單 (Todo)
            </button>
            <button data-slash="bullet" class="w-full text-left px-2.5 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded flex items-center gap-2">
              <i data-lucide="list" class="w-3.5 h-3.5 text-gray-500"></i> 項目符號清單
            </button>
            <button data-slash="callout" class="w-full text-left px-2.5 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded flex items-center gap-2">
              <i data-lucide="message-square" class="w-3.5 h-3.5 text-amber-500"></i> 醒目提示框 (Callout)
            </button>
            <button data-slash="table" class="w-full text-left px-2.5 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded flex items-center gap-2">
              <i data-lucide="table" class="w-3.5 h-3.5 text-emerald-500"></i> 資料表格 (Table)
            </button>
            <button data-slash="code" class="w-full text-left px-2.5 py-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded flex items-center gap-2">
              <i data-lucide="code" class="w-3.5 h-3.5 text-purple-500"></i> 程式碼區塊
            </button>
          </div>
        </div>

        <!-- Markdown 渲染預覽區 -->
        <div id="preview-wrapper" class="flex-1 h-full overflow-y-auto p-4 sm:p-8 bg-white dark:bg-notion-dark prose dark:prose-invert max-w-none hidden md:block">
          <div id="preview-content"></div>
        </div>

        <!-- 右側即時大綱面板 (TOC) -->
        <aside id="outline-panel" class="w-52 border-l border-gray-100 dark:border-notion-borderDark bg-notion-gray/40 dark:bg-notion-darker p-3 overflow-y-auto hidden lg:block shrink-0">
          <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2 flex items-center gap-1">
            <i data-lucide="align-left" class="w-3.5 h-3.5"></i> 內容大綱
          </div>
          <div id="outline-list" class="space-y-1 text-xs text-gray-600 dark:text-gray-400">
            <span class="text-gray-400 italic text-[11px]">暫無標題</span>
          </div>
        </aside>
      </div>

      <!-- 手機專屬：底部快捷編輯工具列 (Mobile Floating Toolbar) -->
      <div id="mobile-toolbar" class="md:hidden h-10 border-t border-gray-200 dark:border-notion-borderDark bg-white dark:bg-notion-dark flex items-center justify-around px-2 z-20 shrink-0 text-gray-600 dark:text-gray-300">
        <button id="mb-tool-media" class="p-1.5 text-blue-600 dark:text-blue-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded" title="上傳圖影">
          <i data-lucide="image-plus" class="w-4 h-4"></i>
        </button>
        <button id="mb-tool-bold" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded font-bold text-xs" title="粗體">
          B
        </button>
        <button id="mb-tool-todo" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded" title="待辦清單">
          <i data-lucide="check-square" class="w-4 h-4"></i>
        </button>
        <button id="mb-tool-list" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded" title="清單">
          <i data-lucide="list" class="w-4 h-4"></i>
        </button>
        <button id="mb-tool-callout" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded text-amber-500" title="提示框">
          <i data-lucide="message-square" class="w-4 h-4"></i>
        </button>
        <button id="mb-tool-preview" class="p-1.5 hover:bg-gray-100 dark:hover:bg-gray-800 rounded" title="預覽">
          <i data-lucide="eye" class="w-4 h-4"></i>
        </button>
        <button id="mb-tool-save" class="p-1.5 text-green-600 dark:text-green-400 hover:bg-gray-100 dark:hover:bg-gray-800 rounded" title="立即存檔">
          <i data-lucide="save" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- 電腦底部統計欄 -->
      <footer class="hidden md:flex h-6 border-t border-gray-100 dark:border-notion-borderDark px-4 items-center justify-between text-[11px] text-gray-400 bg-white dark:bg-notion-dark shrink-0">
        <div class="flex items-center space-x-3">
          <span><strong id="stat-words" class="text-gray-600 dark:text-gray-300">0</strong> 字</span>
          <span><strong id="stat-chars" class="text-gray-600 dark:text-gray-300">0</strong> 字元</span>
          <span>預計閱讀 <strong id="stat-time" class="text-gray-600 dark:text-gray-300">0</strong> 分鐘</span>
        </div>
        <div class="flex items-center space-x-2">
          <span id="stat-autosave" class="flex items-center gap-1">
            <i data-lucide="check" class="w-3 h-3 text-green-500"></i> 自動儲存已就緒
          </span>
        </div>
      </footer>
    </main>
  </div>

  <!-- 設定對話框 (Modal) -->
  <div id="settings-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white dark:bg-notion-card rounded-xl max-w-md w-full p-5 shadow-2xl border border-gray-200 dark:border-notion-borderDark space-y-4">
      <div class="flex items-center justify-between pb-2 border-b border-gray-100 dark:border-notion-borderDark">
        <h3 class="text-sm font-semibold flex items-center gap-1.5 text-gray-900 dark:text-white">
          <i data-lucide="settings" class="w-4 h-4 text-blue-500"></i>
          Google Cloud 設定
        </h3>
        <button id="close-settings-btn" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>

      <p class="text-xs text-gray-500 dark:text-gray-400 leading-relaxed">
        設定儲存於本機瀏覽器，筆記與媒體直接同步至您的 Google Drive。
      </p>

      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Google OAuth Client ID</label>
          <input type="text" id="setting-client-id" placeholder="例如：xxxxxx.apps.googleusercontent.com" class="w-full px-3 py-1.5 text-xs bg-gray-50 dark:bg-notion-dark border border-gray-300 dark:border-notion-borderDark rounded-md focus:ring-1 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 dark:text-gray-300 mb-1">Google Drive 資料夾名稱</label>
          <input type="text" id="setting-folder-name" value="DriveNotes" class="w-full px-3 py-1.5 text-xs bg-gray-50 dark:bg-notion-dark border border-gray-300 dark:border-notion-borderDark rounded-md focus:ring-1 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>

      <div class="pt-1 flex justify-end space-x-2">
        <button id="save-settings-btn" class="px-3.5 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-xs font-medium transition shadow-sm">
          儲存設定
        </button>
      </div>
    </div>
  </div>

  <!-- Toast 訊息提示元件 -->
  <div id="toast" class="fixed bottom-12 md:bottom-5 right-5 bg-gray-900/90 text-white px-3.5 py-2 rounded-lg shadow-xl text-xs transition-opacity duration-300 opacity-0 pointer-events-none z-50 flex items-center space-x-2 backdrop-blur-xs">
    <span id="toast-message">訊息提示</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
